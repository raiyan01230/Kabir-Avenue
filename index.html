<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHM Gadget Zone</title>
    <!-- SEO tags are injected dynamically by the server -->
    <meta name="google-site-verification" content="NJ2KsG7sI0VtOYyoIzt1l47JeUvCzp-YqjOVptbG2ZY" />
    
    <script type="text/javascript">
      // Single Page Apps routing support
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a[1] && decodeURIComponent(a[1].replace(/\+/g, ' '));
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q.replace(/~and~/g, '&')) : '') +
              l.hash
            );
          }
        }
      }(window));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
